name: mediscanai
description: "AI-Powered Dermatological & Symptom Triage with Generative UI"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.1
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0

  firebase_core: ^4.14.0
  cloud_firestore: ^6.9.0
  genkit: ^0.16.1
  genui: ^0.10.2

  tflite_flutter: ^0.12.1
  image: ^4.9.2
  image_picker: ^1.2.3
  image_cropper: ^12.2.1

  dio: ^5.11.1
  firebase_ai: ^4.0.0

  pdf: ^3.13.0
  share_plus: ^13.3.0
  path_provider: ^2.1.4
  firebase_app_check: ^0.4.7
  http_parser: ^4.1.2
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.2
  geolocator: ^14.0.3
  geocoding: ^5.0.0
  flutter_blue_plus: ^2.3.14
  skio_usb_serial: ^0.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  build_runner: ^2.16.1
  freezed: ^4.0.1
  json_serializable: ^6.14.1

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/models/skin_model.tflite
    - assets/models/labels.txt
    - assets/fonts/Amiri-Regular.ttf
    - assets/fonts/NotoNastaliqUrdu-Regular.ttf
    - assets/data/pak_clinical_db.json
    - assets/pak_clinical_db.json